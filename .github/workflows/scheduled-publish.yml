# ─────────────────────────────────────────────────────────────────────────
# WHY THIS WORKFLOW EXISTS
# ─────────────────────────────────────────────────────────────────────────
# rankinwaste.com is hosted on Netlify, but the Netlify site is NOT git-linked.
# A push to master publishes the live site. This workflow rebuilds and deploys
# production immediately on that push or merge. There is no daily timed deploy.
#
# Scheduled pages (see src/lib/schedule.ts) still publish at BUILD time. A
# future-dated page is redirected to /404 and left out of the sitemap until a
# build runs after its date. A push to master runs that build.
#
# It deploys with the Netlify CLI directly (production).
# ─────────────────────────────────────────────────────────────────────────

name: Scheduled Publish

on:
  # A push (or merge) to master rebuilds and deploys production.
  push:
    branches: [master]
  # Lets you trigger a production deploy by hand from the Actions tab
  # (e.g. to publish a page the moment its date passes, without waiting for 8 UTC).
  workflow_dispatch: {}

permissions:
  contents: read

# Never let two publishes overlap.
concurrency:
  group: scheduled-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # matches netlify.toml NODE_VERSION
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # Build time = "now" for the schedule gate. Pages whose date has passed
        # by this moment build live; still-future pages redirect to /404 and are
        # dropped from the sitemap.
        run: npm run build

      - name: Deploy to Netlify (production)
        run: npx --yes netlify-cli@17 deploy --dir=dist --prod --message "Scheduled publish $(date -u +'%Y-%m-%dT%H:%MZ')"
        env:
          # NETLIFY_AUTH_TOKEN is the only real secret — it authorizes the deploy.
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # The site ID is NOT sensitive (it appears in every deploy/admin URL),
          # so it's hardcoded here — no secret needed. Netlify CLI reads it from env.
          NETLIFY_SITE_ID: 1b4ed3a0-3f95-4e8c-aca8-d2373d2bf248
      - name: Submit newly-due pages for indexing (KailenFlow)
        env:
          KAILENFLOW_INDEXING_KEY: ${{ secrets.KAILENFLOW_INDEXING_KEY }}
        run: node scripts/kailenflow-indexing-ping.mjs
